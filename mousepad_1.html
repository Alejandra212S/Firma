<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura de Firma - Mouse y Pad</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }

        .contenedor {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* El lienzo donde se dibuja */
        canvas {
            border: 2px dashed #ccc;
            border-radius: 4px;
            background-color: #fff;
            cursor: crosshair;
            /* Evita el scroll o zoom molesto en móviles al usar el pad */
            touch-action: none; 
        }

        .botones {
            margin-top: 15px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 5px;
            transition: background 0.2s;
        }

        .btn-limpiar {
            background-color: #e74c3c;
            color: white;
        }

        .btn-limpiar:hover {
            background-color: #c0392b;
        }

        .btn-guardar {
            background-color: #2ecc71;
            color: white;
        }

        .btn-guardar:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

<div class="contenedor">
    <h2>Firme aquí</h2>
    <!-- Definimos el tamaño visual del lienzo -->
    <canvas id="canvasFirma" width="500" height="250"></canvas>
    
    <div class="botones">
        <button class="btn-limpiar" id="btnLimpiar">Limpiar</button>
        <button class="btn-guardar" id="btnGuardar">Guardar Firma</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvasFirma');
    const ctx = canvas.getContext('2d');
    const btnLimpiar = document.getElementById('btnLimpiar');
    const btnGuardar = document.getElementById('btnGuardar');

    let dibujando = false;

    // Configuración del trazo de la firma
    ctx.strokeStyle = '#000000'; // Color negro
    ctx.lineWidth = 3;           // Grosor de la línea
    ctx.lineCap = 'round';       // Bordes redondeados para que se vea natural
    ctx.lineJoin = 'round';

    // --- FUNCIONES DE DIBUJO ---

    function comenzarDibujo(x, y) {
        dibujando = true;
        ctx.beginPath();
        ctx.moveTo(x, y);
    }

    function dibujar(x, y) {
        if (!dibujando) return;
        ctx.lineTo(x, y);
        ctx.stroke();
    }

    function terminarDibujo() {
        dibujando = false;
        ctx.closePath();
    }

    // --- OBTENER COORDENADAS PRECISAS ---

    // Obtiene la posición exacta dentro del canvas restando los bordes de la pantalla
    function obtenerCoordenadas(e) {
        const rect = canvas.getBoundingClientRect();
        
        // Si es un evento táctil (pad/pantalla) usa el primer toque, si no usa el mouse
        const clienteX = e.touches ? e.touches[0].clientX : e.clientX;
        const clienteY = e.touches ? e.touches[0].clientY : e.clientY;

        return {
            x: clienteX - rect.left,
            y: clienteY - rect.top
        };
    }

    // --- COMPATIBILIDAD CON MOUSE ---

    canvas.addEventListener('mousedown', (e) => {
        const coords = obtenerCoordenadas(e);
        comenzarDibujo(coords.x, coords.y);
    });

    canvas.addEventListener('mousemove', (e) => {
        const coords = obtenerCoordenadas(e);
        dibujar(coords.x, coords.y);
    });

    window.addEventListener('mouseup', terminarDibujo);

    // --- COMPATIBILIDAD CON PAD / PANTALLA TÁCTIL ---

    canvas.addEventListener('touchstart', (e) => {
        const coords = obtenerCoordenadas(e);
        comenzarDibujo(coords.x, coords.y);
    });

    canvas.addEventListener('touchmove', (e) => {
        // Evita que la pantalla se mueva mientras firmas
        e.preventDefault(); 
        const coords = obtenerCoordenadas(e);
        dibujar(coords.x, coords.y);
    }, { passive: false });

    window.addEventListener('touchend', terminarDibujo);

    // --- BOTONES DE ACCIÓN ---

    // Limpia todo el lienzo
    btnLimpiar.addEventListener('click', () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    // Guarda y descarga la firma en formato PNG
    btnGuardar.addEventListener('click', () => {
        // Convierte el lienzo a una URL de imagen codificada en Base64
        const urlImagen = canvas.toDataURL('image/png');
        
        // Creamos un enlace invisible para forzar la descarga
        const enlace = document.createElement('a');
        enlace.href = urlImagen;
        enlace.download = 'firma.png'; // Nombre del archivo descargado
        enlace.click();
    });
</script>

</body>
</html>
