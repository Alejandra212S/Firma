<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura de Firma - Mouse y Pad</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }

        .contenedor {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        canvas {
            border: 2px dashed #ccc;
            border-radius: 4px;
            background-color: #fff;
            cursor: crosshair;
            touch-action: none;
        }

        .botones {
            margin-top: 15px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 5px;
            transition: background 0.2s;
        }

        .btn-limpiar {
            background-color: #e74c3c;
            color: white;
        }

        .btn-limpiar:hover {
            background-color: #c0392b;
        }

        .btn-guardar {
            background-color: #2ecc71;
            color: white;
        }

        .btn-guardar:hover {
            background-color: #27ae60;
        }
    </style>
</head>

<body>

    <div class="contenedor">
        <h2>Firme aquí</h2>

        <canvas id="canvasFirma" width="500" height="250"></canvas>

        <div class="botones">
            <button class="btn-limpiar" id="btnLimpiar">Limpiar</button>
            <button class="btn-guardar" id="btnGuardar">Guardar Firma</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvasFirma');
        const ctx = canvas.getContext('2d');
        const btnLimpiar = document.getElementById('btnLimpiar');
        const btnGuardar = document.getElementById('btnGuardar');

        let dibujando = false;

        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        function comenzarDibujo(x, y) {
            dibujando = true;
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        function dibujar(x, y) {
            if (!dibujando) return;
            ctx.lineTo(x, y);
            ctx.stroke();
        }

        function terminarDibujo() {
            dibujando = false;
            ctx.closePath();
        }

        function obtenerCoordenadas(e) {
            const rect = canvas.getBoundingClientRect();

            const clienteX = e.touches
                ? e.touches[0].clientX
                : e.clientX;

            const clienteY = e.touches
                ? e.touches[0].clientY
                : e.clientY;

            return {
                x: clienteX - rect.left,
                y: clienteY - rect.top
            };
        }

        /* Mouse */

        canvas.addEventListener('mousedown', (e) => {
            const coords = obtenerCoordenadas(e);
            comenzarDibujo(coords.x, coords.y);
        });

        canvas.addEventListener('mousemove', (e) => {
            const coords = obtenerCoordenadas(e);
            dibujar(coords.x, coords.y);
        });

        window.addEventListener('mouseup', terminarDibujo);

        /* Táctil */

        canvas.addEventListener('touchstart', (e) => {
            const coords = obtenerCoordenadas(e);
            comenzarDibujo(coords.x, coords.y);
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const coords = obtenerCoordenadas(e);
            dibujar(coords.x, coords.y);
        }, { passive: false });

        window.addEventListener('touchend', terminarDibujo);

        /* Limpiar */

        btnLimpiar.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        /* Guardar */

        btnGuardar.addEventListener('click', () => {
            const urlImagen = canvas.toDataURL('image/png');

            const enlace = document.createElement('a');
            enlace.href = urlImagen;
            enlace.download = 'firma.png';
            enlace.click();
        });
    </script>

</body>
</html>
